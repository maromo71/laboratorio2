<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC | Dark Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4 selection:bg-orange-500 selection:text-white font-sans antialiased">

    <main class="bg-slate-800 w-full max-w-md rounded-2xl shadow-[0_0_40px_rgba(249,115,22,0.1)] border border-slate-700 overflow-hidden relative">

        <div class="h-2 w-full bg-gradient-to-r from-orange-600 via-orange-400 to-slate-300"></div>

        <div class="p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-300 pb-1">
                    Calculadora IMC
                </h1>
                <p class="text-slate-400 mt-2 text-sm">Descubra seu índice de massa corporal</p>
            </div>

            <form action="mostra-imc.jsp" method="post" class="space-y-6">

                <div>
                    <label for="peso" class="block text-sm font-medium text-slate-300 mb-2">
                        Peso (kg)
                    </label>
                    <div class="relative">
                        <input type="number" step="0.01" name="peso" id="peso" placeholder="Ex: 75.5" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 px-4 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all duration-300">
                    </div>
                </div>

                <div>
                    <label for="altura" class="block text-sm font-medium text-slate-300 mb-2">
                        Altura (m)
                    </label>
                    <div class="relative">
                        <input type="number" step="0.01" name="altura" id="altura" placeholder="Ex: 1.75" required
                            class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 px-4 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all duration-300">
                    </div>
                </div>

                <button type="submit"
                    class="w-full mt-4 bg-gradient-to-r from-orange-600 to-orange-400 hover:from-orange-500 hover:to-orange-300 text-white font-bold py-3.5 px-4 rounded-lg shadow-lg shadow-orange-500/25 transform transition-all duration-300 hover:-translate-y-1 hover:shadow-orange-500/40 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-orange-500">
                    Calcular IMC
                </button>
            </form>
        </div>
    </main>

</body>
</html>
