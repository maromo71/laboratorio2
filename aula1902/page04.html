<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição</title>
</head>
<body>
    <h1>Formulário de Inscrição</h1>
    <h2>Campeonato de Truco</h2>
    <form action="#" method="post">
        <label for="nome1">Nome do jogador 1: </label>
        <input type="text" name="nome1" id="nome1"> 
        <br>
        <label for="nome2">Nome do jogador 2: </label>
        <input type="text" name="nome2" id="nome2"> 
        <br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email">
        <br>
        <label for="data_chegada">Data de Chegada:</label>
        <input type="date" name="data_chegada" id="data_chegada">
        <br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
